name: CI

on:
  push:
    branches: ["main", "Dhiaelhak-Rached/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 python3-tk

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[control,sim,dev]" opencv-python-headless

      - name: Lint with ruff
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check src sim tests
          fi

      - name: Run unit and simulation tests
        run: python -m pytest -q
